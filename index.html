<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whiskey and Water</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4efe6;
      --ink: #2c261f;
      --muted: #6d6256;
      --rule: #e2d5c3;
      --accent: #8a4b22;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1612;
        --ink: #f4eee6;
        --muted: #cbbba8;
        --rule: #3c342c;
        --accent: #e2a45c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Iowan Old Style", Palatino, "Palatino Linotype", serif;
    }
    main {
      width: min(34rem, calc(100% - 2.5rem));
      padding: 3rem 0 4rem;
    }
    .mark {
      margin: 0 0 1.1rem;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
    }
    h1 {
      margin: 0 0 0.9rem;
      font-weight: 500;
      font-size: clamp(2.3rem, 6vw, 3.25rem);
      letter-spacing: -0.02em;
      line-height: 1.05;
    }
    p {
      margin: 0;
      max-width: 32rem;
      font-size: 1.15rem;
      line-height: 1.55;
      color: var(--muted);
    }
    footer {
      margin-top: 2.25rem;
      padding-top: 0.9rem;
      border-top: 1px solid var(--rule);
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <p class="mark">whiskeyandwater.dev</p>
    <h1>Whiskey and Water</h1>
    <p>A small personal tinkering site that hosts personal projects like Cybertruck telemetry.</p>
    <footer>Personal projects, kept simple.</footer>
  </main>
</body>
</html>
